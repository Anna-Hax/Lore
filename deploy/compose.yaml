name: lore

x-service: &service
  image: lore-agents
  build: {context: .., dockerfile: deploy/Dockerfile}
  restart: unless-stopped
  init: true
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
  stop_grace_period: 30s
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  gateway:
    <<: *service
    environment:
      LORE_SERVICE: gateway
      LORE_CHAIN_ID: "16602"
      LORE_PORT: "8080"
      LORE_DB: /state/gateway.sqlite3
      LORE_STORAGE_CLI: /usr/local/bin/lore-storage-client
      # The hosted MCP server and its World ID login (agents/gateway/worldid.py). Not secrets.
      LORE_PUBLIC_URL: ${LORE_PUBLIC_URL:?Set the public https URL users reach the MCP server at}
      # Leave WORLD_APP_ID empty and set LORE_DEMO_LOGIN=1 for the labelled name-based demo login (testnet only:
      # anyone who types a name is that person). The gateway ignores LORE_DEMO_LOGIN whenever WORLD_APP_ID is set.
      WORLD_APP_ID: ${WORLD_APP_ID:-}
      WORLD_RP_ID: ${WORLD_RP_ID:-}
      LORE_DEMO_LOGIN: ${LORE_DEMO_LOGIN:-0}
      WORLD_ACTION: ${WORLD_ACTION:-lore-person}
      WORLD_IDKIT_MODULE: ${WORLD_IDKIT_MODULE:-https://cdn.jsdelivr.net/npm/@worldcoin/idkit-core@4.6.0/+esm}
      # World ID Agent Pass (gateway/worldidp.py): on when WORLD_IDP_CLIENT_ID is set; its secret is in secrets/gateway.env.
      # Register $LORE_PUBLIC_URL/login/callback as a redirect URI in the World Developer Portal.
      WORLD_IDP_CLIENT_ID: ${WORLD_IDP_CLIENT_ID:-}
      WORLD_IDP_ISSUER: ${WORLD_IDP_ISSUER:-https://auth.world.org}
      WORLD_IDP_ACR: ${WORLD_IDP_ACR:-}
      # Users' wallets on Turnkey with Lore's delegated access (agents/gateway/turnkey.py). Public, not secrets.
      TURNKEY_ORGANIZATION_ID: ${TURNKEY_ORGANIZATION_ID:?Set Lore's Turnkey parent organization id}
      TURNKEY_API_PUBLIC_KEY: ${TURNKEY_API_PUBLIC_KEY:?Set the parent org API public key}
      TURNKEY_DELEGATED_PUBLIC_KEY: ${TURNKEY_DELEGATED_PUBLIC_KEY:?Set from secrets/addresses.json}
    ports: ["127.0.0.1:${GATEWAY_PORT:-8080}:8080"]
    volumes: ["./state/gateway:/state"]
    secrets: [{source: gateway_env, target: lore.env}]

  verifier:
    <<: *service
    depends_on: [gateway]
    environment:
      LORE_SERVICE: verifier
      LORE_CHAIN_ID: "16602"
      LORE_GATEWAY_URL: http://gateway:8080
      LORE_JOBS_DB: /state/jobs.sqlite3
      LORE_STORAGE_CLI: /usr/local/bin/lore-storage-client
      ZG_MODEL: ${ZG_MODEL:-0gm-1.0-35b-a3b}  # TeeML (spike/FINDINGS.md); glm-5.3 hung on the Router
    volumes: ["./state/verifier:/state"]
    secrets: [{source: verifier_env, target: lore.env}]

  curator:
    <<: *service
    depends_on: [gateway]
    environment:
      LORE_SERVICE: curator
      LORE_CHAIN_ID: "16602"
      LORE_GATEWAY_URL: http://gateway:8080
      LORE_JOBS_DB: /state/jobs.sqlite3
      LORE_STORAGE_CLI: /usr/local/bin/lore-storage-client
      ZG_MODEL: ${ZG_MODEL:-0gm-1.0-35b-a3b}  # TeeML (spike/FINDINGS.md); glm-5.3 hung on the Router
    volumes: ["./state/curator:/state"]
    secrets: [{source: curator_env, target: lore.env}]

secrets:
  gateway_env: {file: ./secrets/gateway.env}
  verifier_env: {file: ./secrets/verifier.env}
  curator_env: {file: ./secrets/curator.env}
