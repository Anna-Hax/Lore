[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# 0G docs: compile with Cancun for 0G Chain compatibility.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
# Deploy.s.sol writes addresses to packages/shared/src/deployments/<chainId>.json
fs_permissions = [{ access = "read-write", path = "../packages/shared/src/deployments" }]

[lint]
# Lowercase immutables keep the generated getters readable from JS (usdc(), graph(), roles()).
exclude_lints = ["screaming-snake-case-immutable", "mixed-case-function"]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[rpc_endpoints]
# From the official 0G docs (Galileo testnet, chain ID 16602). See packages/shared/src/network.js.
og_testnet = "https://evmrpc-testnet.0g.ai"
anvil = "http://127.0.0.1:8545"
